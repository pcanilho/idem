{{/*
The idiom from the README. Under `helm install` the lookup finds the existing
Secret and the password is stable. Under ArgoCD the lookup returns {} -- the
repo-server has no cluster access -- so randAlphaNum fires on every render.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
data:
  password: {{ .Values.auth.password
                | default (lookup "v1" "Secret" .Release.Namespace "creds").data
                | default (randAlphaNum 32) | b64enc | quote }}
