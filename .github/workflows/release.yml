# Cuts a release when a version tag is pushed.
#
# The tests run first and on the same runner: idem's own test suite skips
# anything needing helm when helm is absent, so releasing without installing it
# would ship a binary whose most important tests never ran.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Provenance. id-token mints the short-lived OIDC token Sigstore signs
  # against, so there is no key to hold and none to leak.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser builds the changelog from history, and a shallow clone
          # has none.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install helm
        # Pinned, and to the same version ci.yml's helm4 cell uses: a release
        # runs the suite one last time, and "latest" would let a helm published
        # that morning decide whether a tag ships.
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Test
        run: go test ./... -race

      # Release notes come from CHANGELOG.md rather than from commit subjects:
      # a release page is read by someone deciding whether to upgrade, and a
      # list of "fix: ..." lines does not answer that. Extracting here rather
      # than letting goreleaser generate also means a tag with no section fails
      # LOUDLY - which matters, because an immutable release cannot be re-cut.
      - name: Extract changelog section
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes_file="$RUNNER_TEMP/notes.md"
          # The body of the matching '## [version]' section, stopping at the
          # next '## [' header or EOF. The header line itself is dropped: the
          # release title already carries the version. Matched with index()
          # rather than a regex, because a version is full of dots and `0.1.1`
          # as a pattern would also match `0X1X1`.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/             { exit }
            found                          { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::error::No CHANGELOG.md section found for ${TAG} (looked for '## [${version}]'). Add the section before tagging."
            exit 1
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      # goreleaser-action verifies the goreleaser binary it downloads, but only
      # when cosign is on PATH. Without it the release log says "cosign not
      # found in PATH, skipping signature verification" and carries on
      # unverified, which is a supply-chain check that silently does nothing.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ steps.notes.outputs.notes_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needs write access to pcanilho/homebrew-tap, which the default
          # token does not have.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Signed build provenance for what the release just published.
      #
      # action.yml verifies the archive against checksums.txt, which catches a
      # corrupted download and nothing else: both files ship in the same
      # release, so anyone able to replace one could replace both. This is the
      # half that checksums cannot be - `gh attestation verify <archive>
      # --repo pcanilho/idem` answers who built it, and from which commit.
      #
      # Attesting checksums.txt covers every archive listed in it with one
      # subject, which is why it runs after goreleaser rather than per asset.
      - name: Attest the release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
